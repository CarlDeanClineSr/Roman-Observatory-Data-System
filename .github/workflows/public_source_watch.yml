name: Roman Public Source Watch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Validate contracts
        run: roman-watch validate
      - name: Capture configured public sources
        run: roman-watch source-watch --outdir runs/roman/source_watch
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-public-source-watch-${{ github.run_id }}
          path: runs/roman/source_watch/
          if-no-files-found: warn
          retention-days: 90
