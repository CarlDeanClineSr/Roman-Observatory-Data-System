name: Roman MAST Metadata Watch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mast-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Validate contracts
        run: roman-watch validate
      - name: Build mission-list and collection-count evidence
        run: roman-watch mast-catalog --outdir runs/roman/mast_catalog
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-mast-metadata-${{ github.run_id }}
          path: runs/roman/mast_catalog/
          if-no-files-found: warn
          retention-days: 90
