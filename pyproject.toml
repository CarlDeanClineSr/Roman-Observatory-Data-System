[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-observatory-data-system"
version = "0.1.0"
description = "Evidence-preserving metadata-first system for public Roman mission, archive, simulation, and ground-test information"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
roman-watch = "roman_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
